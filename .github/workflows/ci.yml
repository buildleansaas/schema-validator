name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [18, 20, 22]
        include:
          - os: windows-latest
            node: 22
          - os: windows-latest
            node: 24
          # Exiting with process.exit() after an HTTPS fetch aborts on this version (#1).
          - os: windows-latest
            node: 24.16.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx tsc -p .
      - run: npm test
      # Local test servers don't reproduce #1; a live HTTPS site on Windows Node 24.16.0 did
      # (Assertion failed: !(handle->flags & UV_HANDLE_CLOSING)). Needs network access.
      - if: matrix.os == 'windows-latest' && matrix.node == '24.16.0'
        shell: bash
        run: |
          for i in 1 2 3; do
            node bin/schema-validate.js https://example.com --fail-on never > /dev/null
          done
